name: collection_app
description: Application de gestion de collections style vignettes Panini.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Database
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.3   # required for Linux/Windows/macOS desktop
  path: ^1.9.0

  # File paths
  path_provider: ^2.1.2

  # UUID generation
  uuid: ^4.4.0

  # HTTP
  dio: ^5.4.3+1

  # Image picker (mobile) + file picker (desktop)
  image_picker: ^1.1.2
  file_picker: ^8.0.0

  # Shared preferences
  shared_preferences: ^2.2.3

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
